# ----------------------------------------------------------------
# QA (automatic): on every push and pull request
# ----------------------------------------------------------------

name: qa-auto

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: ./.github/workflows/_qa.yaml
