# ----------------------------------------------------------------
# QA (automatic): on every push and pull request
# ----------------------------------------------------------------

name: QA (automatic)

on:
  # NOTE: resort to manual execution instead of run-on-push
  # push:
  #   branches:
  #     - main
  #     - staging

  pull_request:
    branches:
      - main
      - staging
      - 'dev-*'
      - 'bugfix-*'
      - 'hotfix-*'
      - 'feat-*'
      - 'feature-*'
      - 'story-*'

    paths:
      - '**/*'

    # see <https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#discussion>
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - unlocked

permissions:
  contents: read

concurrency:
  group: qa-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-latest"
    environment: "local"
    timeout-minutes: 30
    steps:
      # --------------------------------
      # Setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Setup
        run: |-
          cat <<EOF > .env
          NAME="${{ vars.PROGRAMME_NAME }}"
          HTTP_PORT=${{ vars.HTTP_PORT }}
          EOF

      - name: Build dependencies
        run: |-
          just build
          npx playwright install-deps chromium

      # --------------------------------
      # Checks
      # --------------------------------

      # NOTE: bundle /dist/userscript.js is committed: warn if it was not rebuilt before the commit
      - name: Check build is up to date
        run: |-
          if ! git diff --quiet -- dist/userscript.js; then
            echo "::warning::dist/userscript.js not rebuilt before commit (run \`just build-src\`)"
          fi

      - name: QA - Linting
        run: |-
          just lint-check
          just type-check

      - name: QA - Unit Tests
        run: |-
          just tests-unit

      - name: QA - Behavioural Tests
        run: |-
          just tests-behave
