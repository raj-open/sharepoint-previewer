# ----------------------------------------------------------------
# QA (automatic): on every push and pull request
# ----------------------------------------------------------------

name: qa-auto

on:
  # NOTE: resort to manual execution instead of run-on-push
  # push:
  #   branches:
  #     - main
  #     - staging

  pull_request:
    branches:
      - main
      - staging
      - 'dev-*'
      - 'bugfix-*'
      - 'hotfix-*'
      - 'feat-*'
      - 'feature-*'
      - 'story-*'

    paths:
      - '**/*'

    # see <https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#discussion>
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - unlocked

permissions:
  contents: read

concurrency:
  group: qa-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-latest"
    environment: "local"
    uses: ./.github/workflows/_common.yaml
