# ----------------------------------------------------------------
# RELEASE: on a release tag (v<VERSION>, cf. `just tag`),
# runs qa, builds /dist/v<VERSION> and attaches its files to the GitHub release
# (created if missing; pre-release for alpha, beta, rc)
# ----------------------------------------------------------------

name: Release

on:
  # NOTE: disabled as release should be manually triggered
  # push:
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        default: ""
        type: string

permissions:
  contents: read

env:
  LABEL_ARTEFACTS: "artefacts"
  PATH_ARTEFACTS: "dist/artefacts"

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-latest"
    environment: "local"
    timeout-minutes: 30
    steps:
      # --------------------------------
      # Setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Setup
        run: |-
          cat <<EOF > .env
          NAME="${{ vars.PROGRAMME_NAME }}"
          HTTP_PORT=${{ vars.HTTP_PORT }}
          EOF

      - name: Build dependencies + artefacts
        run: |-
          just build
          npx playwright install-deps chromium

      # --------------------------------
      # Checks
      # --------------------------------

      - name: QA - Linting
        run: |-
          just lint-check
          just type-check

      - name: QA - Unit Tests
        run: |-
          just tests-unit

      - name: QA - Behavioural Tests
        run: |-
          just tests-behave

      # --------------------------------
      # Artefacts
      # --------------------------------

      - name: Rename artefacts folder
        run: |-
          mkdir -p "${{ env.PATH_ARTEFACTS }}"
          cp -r dist/v*/. "${{ env.PATH_ARTEFACTS }}"

      - name: Buffer artefacts between job stages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "${{ env.LABEL_ARTEFACTS }}"
          path: "${{ env.PATH_ARTEFACTS }}"

  release:
    name: Release
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # --------------------------------
      # Setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      # --------------------------------
      # Release
      # --------------------------------

      - name: Load artefacts from previous stage
        uses: actions/download-artifact@v8.0.2
        with:
          name: "${{ env.LABEL_ARTEFACTS }}"
          # merge-multiple: true # <- NOTE: only needed for matrix-build
          # pattern: "*"
          path: "${{ env.PATH_ARTEFACTS }}"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: "${{ env.PATH_ARTEFACTS }}/*"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
