# ----------------------------------------------------------------
# RELEASE: on a release tag (v<VERSION>, cf. `just tag`),
# runs qa, builds /dist/v<VERSION> and attaches its files to the GitHub release
# (created if missing; pre-release for alpha, beta, rc)
# ----------------------------------------------------------------

name: Release

on:
  # NOTE: disabled as release should be manually triggered
  # push:
  #   tags:
  #     - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        default: 'v0.0.0-test'
        type: string

permissions:
  contents: read

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-latest"
    environment: "local"
    timeout-minutes: 30
    steps:
      # --------------------------------
      # setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Setup
        run: |-
          cat <<EOF > .env
          NAME="${{ vars.PROGRAMME_NAME }}"
          HTTP_PORT=${{ vars.HTTP_PORT }}
          EOF

      - name: Build dependencies
        run: |-
          just build
          npx playwright install-deps chromium

      # NOTE: bundle in /src is committed: warn if it was not rebuilt before the commit
      - name: Check build is up to date
        run: |-
          if ! git diff --quiet -- src/main.js src/main.min.js; then
            echo "::warning::src/main.js or src/main.min.js not rebuilt before commit (run \`just build-src\`)"
          fi

      # --------------------------------
      # checks
      # --------------------------------

      - name: QA - Linting
        run: |-
          just lint-check
          just type-check

      - name: QA - Unit Tests
        run: |-
          just tests-unit

      - name: QA - Behavioural Tests
        run: |-
          just tests-behave

  release:
    name: release
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # --------------------------------
      # setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      # --------------------------------
      # build (no browser needed)
      # --------------------------------

      - name: build
        run: |-
          npm ci --no-audit --no-fund
          just build-dist

      # --------------------------------
      # release
      # --------------------------------


      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/v*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
