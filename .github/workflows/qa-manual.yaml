# ----------------------------------------------------------------
# QA (manual): on demand, for any branch, tag or commit
# ----------------------------------------------------------------

name: QA (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: |-
          Choice of environment for pipeline
        # NOTE: this option provides dropdown list of choices of environments set on GitHub (enterprise only)
        type: environment
        required: true
        default: "local"

permissions:
  contents: read

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-26.04"
    environment: "${{ github.event.inputs.environment }}"
    timeout-minutes: 30
    steps:
      # --------------------------------
      # Setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Setup
        run: |-
          cat <<EOF > .env
          NAME="${{ vars.PROGRAMME_NAME }}"
          HTTP_PORT=${{ vars.HTTP_PORT }}
          # behavioural tests: Google Chrome of the runner image (no browser download)
          BROWSER_CHANNEL=chrome
          EOF

      - name: Build dependencies
        run: |-
          just build

      # --------------------------------
      # Checks
      # --------------------------------

      - name: QA - Linting
        run: |-
          just lint-check
          just type-check

      - name: QA - Unit Tests
        run: |-
          just tests-unit

      - name: QA - Behavioural Tests
        run: |-
          just tests-behave
