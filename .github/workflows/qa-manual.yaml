# ----------------------------------------------------------------
# QA (manual): on demand, for any branch, tag or commit
# ----------------------------------------------------------------

name: qa-manual

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or commit (empty = the chosen branch)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/_qa.yaml
    with:
      ref: ${{ inputs.ref }}
