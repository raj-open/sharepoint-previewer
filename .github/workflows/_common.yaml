# ----------------------------------------------------------------
# QA (reusable): lint checks + type check + all tests, as `just qa`
# cf. /justfile (target `qa`) and /specs.md (section Quality)
# ----------------------------------------------------------------

name: qa

on:
  workflow_call:
    environment:
      description: |-
        Choice of environment for pipeline
      # NOTE: this option provides dropdown list of choices of environments set on GitHub (enterprise only)
      type: environment
      reuired: true
      default: "local"

permissions:
  contents: read

jobs:
  qa:
    name: QA
    runs-on: "ubuntu-latest"
    environment: "${{ github.event.inputs.environment }}"
    timeout-minutes: 30
    steps:
      # --------------------------------
      # setup
      # --------------------------------

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - name: Setup
        run: |-
          cat <<EOF > .env
          NAME="${{ vars.PROGRAMME_NAME }}"
          HTTP_PORT=${{ vars.HTTP_PORT }}
          EOF

      - name: Build dependencies
        run: |-
          just build

      # NOTE: bundle in /src is committed: warn if it was not rebuilt before the commit
      - name: Check build is up to date
        run: |-
          if ! git diff --quiet -- src/main.js src/main.min.js; then
            echo "::warning::src/main.js or src/main.min.js not rebuilt before commit (run \`just build-src\`)"
          fi

      # --------------------------------
      # checks
      # --------------------------------

      - name: QA - Linting
        run: |-
          just lint-check
          just type-check

      - name: QA - Unit Tests
        run: |-
          just tests-unit

      - name: QA - Behavioural Tests
        run: |-
          just tests-behave
